# EV-C4 门禁分层：PR 快、nightly 全、release 严。
#
# **红灯只判「能不能跑完、报告结构完不完整」，不判准确率。** 8 题里翻 1 题就是 12.5pp，
# 任何门槛拦住的都是噪声（双侧精确 McNemar 要 6:0 才显著）。唯一例外是 PR 档的 oracle：
# 假模型的输出就是标准答案，判错只能说明判分链路坏了。档位定义、8 题名单与理由见
# docs/eval/tiers.md。
#
# 配置（与 drift.yml 共用同一套 secret/variable 名）：
#   Secret   DATACHAT_LLM_KEY                 真 Key；fork PR 拿不到，这是 GitHub 的安全设计
#   Variable DATACHAT_LLM_BASE_URL / DATACHAT_LLM_MODEL
#   Environment `release`                     要在仓库设置里配 Required reviewers 才有"人工确认"
#
# 两条刻意的写法：
#   1) secret 不进 job 级 env —— 只有真模型那一步注入。PR 来自同仓库分支时 step 能读环境
#      变量，job 级注入等于把 Key 交给每一条 `run:`。
#   2) 闸门报告的 glob 不能直接喂给校验器 —— `docs/eval/` 里躺着 4 份历史 gate 报告，
#      glob 会连它们一起校验，然后因为老格式缺字段而红。只查本次新增（未跟踪）的那份。
#
# 跳过一定会打印原因：`if:` 跳过的 step 在 UI 里只是灰色，和"跑绿了"只差一个眼色。
name: eval

on:
  pull_request:
  schedule:
    - cron: "0 19 * * *"        # 19:00 UTC = 次日 03:00 北京时间
  workflow_dispatch:
    inputs:
      tier:
        description: "跑哪一档"
        type: choice
        options: [pr, nightly, release, inject]
        default: pr
      # A1 定向复跑入口（[167]）。rerun_report 为空时这条路径完全不存在 —— 三个 tier 的
      # 行为一个字都没变；非空时下面的 pr/nightly/release 全部被 if 挡掉，只跑 rerun job。
      rerun_report:
        description: "（可选）定向复跑：主报告路径，如 docs/eval/gate_20261112_012832_react.json"
        type: string
        default: ""
      rerun_only:
        description: "（可选）复跑题号，逗号分隔，如 s09；不填则复跑全部名单外错题"
        type: string
        default: ""
      rerun_reason:
        description: "（可选）复跑理由，写进 rerun_history；填了 rerun_only 就必须填这个"
        type: string
        default: ""
      rerun_agent:
        description: "（可选）主报告出自哪个 agent"
        type: choice
        options: [react, workflow]
        default: react
  push:
    tags: ["v*"]

concurrency:
  # rerun 单独一个 group：它是"对历史报告的定向复跑"，不该被 pr 档挤掉，也不该挤掉 nightly。
  group: eval-${{ github.ref }}-${{ inputs.rerun_report != '' && 'rerun' || inputs.tier || 'auto' }}
  cancel-in-progress: false      # nightly / release 不能被后到的跑打断

env:
  PYTHONUTF8: "1"

jobs:
  # ---------------------------------------------------------------- PR：不花钱，25 分钟内出结论
  pr:
    if: >
      github.event_name == 'pull_request' ||
      (github.event_name == 'workflow_dispatch' && inputs.tier == 'pr' && (inputs.rerun_report || '') == '')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: 安装依赖
        run: python -m pip install -r requirements.txt
      - name: 评测数据与生成脚本一致
        run: python scripts/gen_eval_data.py --check

      # --oracle 用假模型：输出 = 标准答案。它不测模型，只测「判分链路 + 执行器 + 报告」还通不通。
      - name: oracle 全量（不调模型）
        run: python run_eval.py --oracle --agent react --out outputs/pr_oracle.json
      # 期望题数必须镜像运行器的口径：oracle / 真模型默认 memory off，
      # run_eval 会跳过 7 条 requires_memory 题（mem_001–007），报告实际是 195 条。
      # 上一版写 len(ALL_CASES)=202，tier_check 因「195 ≠ 202」结构性红灯，永远不可能绿。
      - name: 题集规模
        id: n
        run: echo "n=$(python -c 'from app.eval.cases import ALL_CASES; print(sum(1 for c in ALL_CASES if not getattr(c, "requires_memory", "")))')" >> "$GITHUB_OUTPUT"
      - name: oracle 必须全过（判错 = 判分链路坏了，这是本档唯一的红灯）
        run: >
          python scripts/eval/tier_check.py outputs/pr_oracle.json
          --expect-n ${{ steps.n.outputs.n }} --require-all --label pr-oracle

      # fork PR 拿不到 secret，跳过是正常的；不打印原因，绿会骗人。
      - name: 有没有 secret
        id: key
        run: echo "has=${{ secrets.DATACHAT_LLM_KEY != '' }}" >> "$GITHUB_OUTPUT"
      - name: 8 题冒烟（真模型）
        if: steps.key.outputs.has == 'true'
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DATACHAT_LLM_KEY }}
          DEEPSEEK_BASE_URL: ${{ vars.DATACHAT_LLM_BASE_URL }}
          DEEPSEEK_MODEL: ${{ vars.DATACHAT_LLM_MODEL }}
        run: >
          python run_eval.py --agent react --no-fail
          --case ord_007,agg_013,ord_012,emp_015,ts_010,ord_026,ord_027,mul_005
          --out outputs/pr_smoke.json
      - name: 冒烟只产出不判红（8 题测不出小差异）
        if: steps.key.outputs.has == 'true'
        run: python scripts/eval/tier_check.py outputs/pr_smoke.json --expect-n 8 --label pr-smoke
      - name: 跳过冒烟时说明原因
        if: steps.key.outputs.has != 'true'
        run: |
          echo "::notice::跳过 8 题真模型冒烟：本 workflow 没拿到 secret。"
          echo "::notice::fork PR 拿不到 secret 是 GitHub 的安全设计，不绕；PR 的红灯只由 oracle 决定。"

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: eval-pr-${{ github.run_id }}
          path: outputs/pr_*.json
          retention-days: 14
          if-no-files-found: warn

  # ---------------------------------------------------------------- nightly：真模型，发现问题开 issue
  nightly:
    if: >
      github.event_name == 'schedule' ||
      (github.event_name == 'workflow_dispatch' && inputs.tier == 'nightly' && (inputs.rerun_report || '') == '')
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write   # 报告回流要往 docs/eval 提交
      issues: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      # 装 dev 组而不是 runtime 组：闸门数据生成（scripts/gate/build_gate_data.py:122）
      # 要 `pd.read_excel(engine="openpyxl")`，而 openpyxl 只锁在 requirements-dev.txt。
      # 闸门数据走 Actions cache，**首次必然 miss** → 一定会走到生成那步 → 少装就是 ImportError。
      # 不写死 `openpyxl==3.1.5` 是为了让版本只锁在 requirements-dev.txt 一处。
      - name: 安装依赖
        run: python -m pip install -r requirements-dev.txt

      # nightly 的意义就是真模型：没有 Key 不是"跳过"，是配置错了。
      - name: 有没有 secret
        id: key
        run: echo "has=${{ secrets.DATACHAT_LLM_KEY != '' }}" >> "$GITHUB_OUTPUT"
      - name: 缺 Key 直接报错
        if: steps.key.outputs.has != 'true'
        run: |
          echo "::error::nightly 需要 secret DATACHAT_LLM_KEY。schedule 触发的 job 不受 fork 限制，这就是没配。"
          exit 1

      # 闸门数据不入库（体积），走 Actions cache；命中就不重新下载生成。
      - name: 恢复闸门数据缓存
        id: restore
        uses: actions/cache/restore@v4
        with:
          path: data/gate
          key: gate-data-v2-${{ runner.os }}-${{ hashFiles('scripts/gate/build_gate_data.py', 'scripts/gate/fingerprints.py', 'requirements.txt', 'requirements-dev.txt') }}
      - name: 生成闸门数据（仅缓存未命中）
        if: steps.restore.outputs.cache-hit != 'true'
        run: python scripts/gate/build_gate_data.py
      - name: 校验闸门数据现场
        run: python scripts/gate/build_gate_data.py --check
      - name: 保存闸门数据缓存
        if: steps.restore.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: data/gate
          key: ${{ steps.restore.outputs.cache-primary-key }}

      # 闸门报告要人工填 human_correct，CI 填不了 —— 所以这里只查结构，不查准确率。
      - name: 25 闸门题（真模型）
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DATACHAT_LLM_KEY }}
          DEEPSEEK_BASE_URL: ${{ vars.DATACHAT_LLM_BASE_URL }}
          DEEPSEEK_MODEL: ${{ vars.DATACHAT_LLM_MODEL }}
        run: python scripts/gate/run_gate.py --agent react
      - name: 找出本次新产出的闸门报告
        id: gate
        run: |
          FILES=$(git ls-files --others --exclude-standard 'docs/eval/gate_*.json')
          if [ -z "$FILES" ]; then echo "::error::没找到新产出的闸门报告"; exit 1; fi
          echo "files<<EOF" >> "$GITHUB_OUTPUT"
          echo "$FILES" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"
      # 题数从 QUESTIONS 算，不写死 25：加题时 CI 不该红，少跑题才该红。
      - name: 闸门题数
        id: gn
        run: echo "n=$(python -c 'import sys; sys.path.insert(0, "scripts/gate"); from questions import QUESTIONS; print(len(QUESTIONS))')" >> "$GITHUB_OUTPUT"
      - name: 闸门报告结构必须完整
        run: >
          python scripts/eval/tier_check.py ${{ steps.gate.outputs.files }}
          --kind gate --expect-n ${{ steps.gn.outputs.n }} --label nightly-gate

      - name: 8 题冒烟（真模型）
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DATACHAT_LLM_KEY }}
          DEEPSEEK_BASE_URL: ${{ vars.DATACHAT_LLM_BASE_URL }}
          DEEPSEEK_MODEL: ${{ vars.DATACHAT_LLM_MODEL }}
        run: >
          python run_eval.py --agent react --no-fail
          --case ord_007,agg_013,ord_012,emp_015,ts_010,ord_026,ord_027,mul_005
          --out outputs/nightly_smoke.json
      - name: 冒烟只产出不判红
        run: python scripts/eval/tier_check.py outputs/nightly_smoke.json --expect-n 8 --label nightly-smoke

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: eval-nightly-${{ github.run_id }}
          path: |
            docs/eval/gate_*.json
            outputs/nightly_smoke.json
          retention-days: 30
          if-no-files-found: warn

      # 报告回流：artifact 到期（30 天）就只剩一张「成功/失败」的脸，逐题数据必须进 git。
      # **只回 gate 报告，不重算台账**：CI 里 outputs/ 只有本次这一份，跑 eval_ledger.py
      # 会拿 40 份覆盖本地 135 份的 LEDGER（历史批次全部消失）。台账只能在全量 outputs 的
      # 机器上重建，这是刻意的分工。8 题冒烟不值钱（n<10 不进趋势），只留 artifact。
      # 用 GITHUB_TOKEN 提交的 commit 不会触发其它 workflow，不会自激。
      - name: 报告回流仓库
        if: always() && steps.gate.outcome == 'success' && github.ref == 'refs/heads/master'
        run: |
          set -euo pipefail
          FILES="${{ steps.gate.outputs.files }}"
          if [ -z "$FILES" ]; then echo "::notice::本次没有新产出的闸门报告，跳过回流。"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add $FILES
          if git diff --cached --quiet; then echo "::notice::无新增内容，跳过提交。"; exit 0; fi
          git commit -m "chore(eval): 回流 nightly 报告 run ${GITHUB_RUN_ID}"
          for i in 1 2 3; do
            git fetch origin master
            git rebase origin/master
            if git push origin HEAD:master; then exit 0; fi
            sleep 5
          done
          echo "::error::报告回流推送失败（重试 3 次）"
          exit 1

      - name: 失败开 issue
        if: failure() && github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 同一个故障连续几晚失败时只留一条：每日新开 issue 会把人训练成不看通知。
          OPEN=$(gh issue list --state open --search 'nightly 评测失败 in:title' --json number --jq 'length')
          if [ "$OPEN" -gt 0 ]; then
            echo "::notice::已有 $OPEN 条开着的 nightly 失败 issue，本次不重复开。"
            exit 0
          fi
          gh issue create \
            --title "nightly 评测失败：${GITHUB_SHA:0:7}" \
            --body "运行：${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

          红灯只可能来自「跑不完」或「报告结构不完整」——准确率不判红（理由见 docs/eval/tiers.md）。
          先看 artifact 里那份报告缺了什么，再决定是补数据还是修流水线。"

  # ---------------------------------------------------------------- inject：录 B9 注入基线（EV-B9）
  # 单独一档的理由：release 首跑要人工审批且带 130 题真模型，录 9 条注入语料的基线不该占那个窗口。
  # 用与 release 完全相同的 secret/variable（DATACHAT_LLM_KEY + DATACHAT_LLM_BASE_URL/MODEL），
  # 保证基线的模型和以后门禁判的模型是同一个 —— 不同模型之间的命中数不可比。
  # 产物 docs/eval/inject_baseline.json 由人复核后提交（和 release 报告一样不自动 push）。
  inject:
    if: >
      github.event_name == 'workflow_dispatch' && inputs.tier == 'inject' &&
      (inputs.rerun_report || '') == ''
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: 安装依赖
        run: python -m pip install -r requirements-dev.txt
      - name: 有没有 secret
        id: key
        run: echo "has=${{ secrets.DATACHAT_LLM_KEY != '' }}" >> "$GITHUB_OUTPUT"
      - name: 缺 Key 直接报错
        if: steps.key.outputs.has != 'true'
        run: |
          echo "::error::录基线需要 secret DATACHAT_LLM_KEY。"
          exit 1
      - name: 注入基线（真模型固定语料）
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DATACHAT_LLM_KEY }}
          DEEPSEEK_BASE_URL: ${{ vars.DATACHAT_LLM_BASE_URL }}
          DEEPSEEK_MODEL: ${{ vars.DATACHAT_LLM_MODEL }}
        run: >
          python scripts/inject_check.py --spawn --write-baseline
          --out outputs/inject_baseline_run.json
      - name: 打印基线文件（日志里直接可读，供核对）
        if: always()
        run: cat docs/eval/inject_baseline.json 2>/dev/null || echo "::warning::没有产出基线文件"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: inject-baseline-${{ github.run_id }}
          path: |
            docs/eval/inject_baseline.json
            outputs/inject_baseline_run.json
            outputs/inject_baseline_run.server.log
          retention-days: 90
          if-no-files-found: warn

  # ---------------------------------------------------------------- rerun：对历史报告定向复跑（A1）
  # 为什么单开 job 而不是塞进 nightly：nightly 有 8 个步骤只在"整批跑"时成立（找新产出的报告、
  # 题数、结构校验、8 题冒烟、回流），塞进去得给每一步加 if，漏一个就会出现 rerun 模式下又跑了整批。
  # job 级 if 只有一处判断。
  #
  # 前提检查（scripts/gate/run_gate.py:_check_rerun_env）比的是 app/scripts/tests/requirements
  # 的 tree 指纹，不是 commit sha —— 人工判定必然要改报告并提交，HEAD 一定会前移。
  # 所以这里 checkout master HEAD 是安全的：只要没碰评测代码，复跑数值就与主报告可比。
  rerun:
    if: github.event_name == 'workflow_dispatch' && inputs.rerun_report != ''
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write   # 复跑行要写回报告并提交
    steps:
      # 复跑要读主报告那个 commit 的 tree 指纹（`_check_rerun_env` 比 app/scripts/tests/
      # requirements 而不是比 sha），checkout 默认 fetch-depth: 1 会把那个对象留在远端 ——
      # 实测撞过一次：`读不到 ec7c790 的 tree`，job 1 分钟就红。
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      # 同 nightly：build_gate_data.py 要 openpyxl，只锁在 dev 组里。
      - name: 安装依赖
        run: python -m pip install -r requirements-dev.txt

      - name: 有没有 secret
        id: key
        run: echo "has=${{ secrets.DATACHAT_LLM_KEY != '' }}" >> "$GITHUB_OUTPUT"
      - name: 缺 Key 直接报错
        if: steps.key.outputs.has != 'true'
        run: |
          echo "::error::定向复跑要真模型，缺 secret DATACHAT_LLM_KEY。"
          exit 1

      - name: 恢复闸门数据缓存
        id: restore
        uses: actions/cache/restore@v4
        with:
          path: data/gate
          key: gate-data-v2-${{ runner.os }}-${{ hashFiles('scripts/gate/build_gate_data.py', 'scripts/gate/fingerprints.py', 'requirements.txt', 'requirements-dev.txt') }}
      - name: 生成闸门数据（仅缓存未命中）
        if: steps.restore.outputs.cache-hit != 'true'
        run: python scripts/gate/build_gate_data.py
      - name: 校验闸门数据现场
        run: python scripts/gate/build_gate_data.py --check
      - name: 保存闸门数据缓存
        if: steps.restore.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: data/gate
          key: ${{ steps.restore.outputs.cache-primary-key }}

      # workflow_dispatch 的输入是外部字符串，拼进命令行之前先钉死形状：只能指向 docs/eval 下的
      # 闸门报告，不接受 ../ 或绝对路径。
      - name: 报告路径必须落在 docs/eval
        env:
          REPORT: ${{ inputs.rerun_report }}
        run: |
          set -euo pipefail
          case "$REPORT" in
            docs/eval/gate_*.json) ;;
            *) echo "::error::rerun_report 只接受 docs/eval/gate_*.json，收到：$REPORT"; exit 1 ;;
          esac
          if [ ! -f "$REPORT" ]; then echo "::error::报告不存在：$REPORT"; exit 1; fi

      - name: 定向复跑（真模型）
        id: rr
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DATACHAT_LLM_KEY }}
          DEEPSEEK_BASE_URL: ${{ vars.DATACHAT_LLM_BASE_URL }}
          DEEPSEEK_MODEL: ${{ vars.DATACHAT_LLM_MODEL }}
          REPORT: ${{ inputs.rerun_report }}
          ONLY: ${{ inputs.rerun_only }}
          REASON: ${{ inputs.rerun_reason }}
          AGENT: ${{ inputs.rerun_agent }}
        run: |
          # GitHub 给 `run:` 的默认 shell 是 `bash -e`，run_gate 的非零退出码会当场终止脚本，
          # 后面 `code=$?` 根本执行不到 —— 实测撞过：run_gate 返回 2（待签字），job 直接红。
          # 用 `|| code=$?` 接住，别指望 `set -uo pipefail` 能关掉外层的 -e（它关不掉）。
          set -uo pipefail
          ARGS=(--rerun "$REPORT" --profile m13r --agent "$AGENT" --reason "$REASON")
          if [ -n "$ONLY" ]; then ARGS+=(--only ${ONLY//,/ }); fi
          echo "命令：python scripts/gate/run_gate.py ${ARGS[*]}"
          code=0
          python scripts/gate/run_gate.py "${ARGS[@]}" || code=$?
          # 0 = 已结案；2 = 有题待签字 / 有效复跑次数不足（预期：签字后再跑 --verdict 结案）；
          # 1 = 复跑判出回归；3 = 前提不满足。
          echo "exit=$code" >> "$GITHUB_OUTPUT"
          case "$code" in
            0|2) echo "::notice::run_gate 退出码 $code（0=结案 / 2=待人工签字，均为预期）" ;;
            *)   echo "::error::run_gate 退出码 $code"; exit "$code" ;;
          esac

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: eval-rerun-${{ github.run_id }}
          path: docs/eval/gate_*.json
          retention-days: 30
          if-no-files-found: warn

      # 复跑数据必须进 git：artifact 30 天就没了，而"这题到底是波动还是回归"要靠它结案。
      # 用 GITHUB_TOKEN 提交的 commit 不会触发其它 workflow，不会自激。
      - name: 复跑结果写回仓库
        if: always()
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/eval
          if git diff --cached --quiet; then echo "::notice::报告没有变化，跳过提交。"; exit 0; fi
          git commit -m "chore(eval): 定向复跑 run ${GITHUB_RUN_ID}（待人工签字）"
          for i in 1 2 3; do
            git fetch origin master
            git rebase origin/master
            if git push origin HEAD:master; then exit 0; fi
            sleep 5
          done
          echo "::error::复跑报告写回推送失败（重试 3 次）"
          exit 1

  # ---------------------------------------------------------------- release：人工确认，产出归档
  release:
    if: >
      startsWith(github.ref, 'refs/tags/v') ||
      (github.event_name == 'workflow_dispatch' && inputs.tier == 'release' && (inputs.rerun_report || '') == '')
    runs-on: ubuntu-latest
    timeout-minutes: 300
    environment: release          # 需要 reviewer 批准才会真的开始跑
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      # 同 nightly：release 也要跑 build_gate_data.py，openpyxl 只在 dev 组里。
      - name: 安装依赖
        run: python -m pip install -r requirements-dev.txt
      - name: 有没有 secret
        id: key
        run: echo "has=${{ secrets.DATACHAT_LLM_KEY != '' }}" >> "$GITHUB_OUTPUT"
      - name: 缺 Key 直接报错
        if: steps.key.outputs.has != 'true'
        run: |
          echo "::error::release 需要 secret DATACHAT_LLM_KEY。"
          exit 1

      # 先自检判分链路：如果 oracle 都过不了，后面的真模型读数没有意义。
      - name: oracle 自检
        run: python run_eval.py --oracle --agent react --out outputs/rel_oracle.json
      # 同 pr 档：期望题数镜像运行器口径（memory off 跳过 7 条 mem_* 题，实际 195）。
      # oracle 自检与全量真模型都不带 --memory，两次报告都是 195 条，共用一个数。
      - name: 题集规模
        id: n
        run: echo "n=$(python -c 'from app.eval.cases import ALL_CASES; print(sum(1 for c in ALL_CASES if not getattr(c, "requires_memory", "")))')" >> "$GITHUB_OUTPUT"
      - name: oracle 必须全过
        run: >
          python scripts/eval/tier_check.py outputs/rel_oracle.json
          --expect-n ${{ steps.n.outputs.n }} --require-all --label release-oracle

      # --no-fail：release 全量测的是"跑得完 + 报告结构完整 + 闸门三件过"，准确率不进退出码
      # （文件头：「红灯只判能不能跑完、报告结构完不完整，不判准确率」）。少这个开关时，
      # 20 道错题就会让这一步 exit 1，把后面的闸门题 / pass^3 / 注入三道门禁一起跳过 ——
      # run 43343327588 就是这么红的：195 题全跑完、报告也存了，却只做成了 oracle 那一件。
      # 真崩溃仍走异常路径退出码非零（run_eval.py 的 --no-fail 只改 sys.exit 那一行）。
      - name: 全量评测（真模型）
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DATACHAT_LLM_KEY }}
          DEEPSEEK_BASE_URL: ${{ vars.DATACHAT_LLM_BASE_URL }}
          DEEPSEEK_MODEL: ${{ vars.DATACHAT_LLM_MODEL }}
        run: python run_eval.py --agent react --no-fail --out outputs/rel_full.json
      - name: 全量报告结构完整
        run: >
          python scripts/eval/tier_check.py outputs/rel_full.json
          --expect-n ${{ steps.n.outputs.n }} --label release-full

      - name: 恢复闸门数据缓存
        id: restore
        uses: actions/cache/restore@v4
        with:
          path: data/gate
          key: gate-data-v2-${{ runner.os }}-${{ hashFiles('scripts/gate/build_gate_data.py', 'scripts/gate/fingerprints.py', 'requirements.txt', 'requirements-dev.txt') }}
      - name: 生成闸门数据（仅缓存未命中）
        if: steps.restore.outputs.cache-hit != 'true'
        run: python scripts/gate/build_gate_data.py
      - name: 25 闸门题（真模型）
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DATACHAT_LLM_KEY }}
          DEEPSEEK_BASE_URL: ${{ vars.DATACHAT_LLM_BASE_URL }}
          DEEPSEEK_MODEL: ${{ vars.DATACHAT_LLM_MODEL }}
        run: python scripts/gate/run_gate.py --agent react
      - name: 找出本次新产出的闸门报告
        id: gate
        run: |
          FILES=$(git ls-files --others --exclude-standard 'docs/eval/gate_*.json')
          if [ -z "$FILES" ]; then echo "::error::没找到新产出的闸门报告"; exit 1; fi
          echo "files<<EOF" >> "$GITHUB_OUTPUT"
          echo "$FILES" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"
      - name: 闸门题数
        id: gn
        run: echo "n=$(python -c 'import sys; sys.path.insert(0, "scripts/gate"); from questions import QUESTIONS; print(len(QUESTIONS))')" >> "$GITHUB_OUTPUT"
      - name: 闸门报告结构必须完整
        run: >
          python scripts/eval/tier_check.py ${{ steps.gate.outputs.files }}
          --kind gate --expect-n ${{ steps.gn.outputs.n }} --label release-gate

      # pass^3 用 canary 十条：它们本来就是"锁权重"的固定探针。
      # 不判红：ord_013 / ord_017 历史上各掉过一轮，读到 8/10 是真实读数，不是 bug。
      - name: pass^3（canary 十条 × 3 跑）
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DATACHAT_LLM_KEY }}
          DEEPSEEK_BASE_URL: ${{ vars.DATACHAT_LLM_BASE_URL }}
          DEEPSEEK_MODEL: ${{ vars.DATACHAT_LLM_MODEL }}
        # --no-fail：canary 掉题是真实读数不是 bug（注释见上），退出码不该把它当回归。
        run: python run_eval.py --agent react --no-fail --canary --repeat 3

      # EV-B9 注入门禁：固定语料 9 条走 HTTP API 真模型（THREAT_MODEL §2.3 尾注；
      # 语料 tests/fixtures/injection/payloads.json，判定与门禁 scripts/inject_check.py）。
      # --spawn 自起后端（127.0.0.1 随机端口随机 token，读 stdout 第一行 JSON），跑完即杀不留状态；
      # 命中数超 docs/eval/inject_baseline.json 基线（按类记）时 exit 2 直接挡下 release。
      - name: 注入门禁（真模型固定语料）
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DATACHAT_LLM_KEY }}
          DEEPSEEK_BASE_URL: ${{ vars.DATACHAT_LLM_BASE_URL }}
          DEEPSEEK_MODEL: ${{ vars.DATACHAT_LLM_MODEL }}
        run: >
          python scripts/inject_check.py --spawn
          --baseline docs/eval/inject_baseline.json
          --out outputs/inject_release.json

      # 归档只做 artifact，不自动 commit 回 master：
      # 自动 push 会绕过 PR 流程，与本仓库"一个 PR 一个问题"的纪律冲突。
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: eval-release-${{ github.run_id }}
          path: |
            outputs/rel_*.json
            outputs/eval_react_canary_*_run*.json
            docs/eval/gate_*.json
            outputs/inject_release.json
            outputs/inject_release.server.log
          retention-days: 90
          if-no-files-found: warn
      - name: 归档说明
        if: success()
        run: |
          echo "::notice::报告已上传 artifact（保留 90 天）。"
          echo "::notice::要入库请人工挑文件提交到 docs/eval/ —— 自动 push 会绕过 PR 流程。"
