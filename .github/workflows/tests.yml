# 阶段 3：每次推送与 PR 在 GitHub 云端跑 pytest（Linux + Windows × Python 3.11 / 3.12）。
# 公开仓库的 Actions 分钟数免费；不调用任何模型，不需要 Key（oracle 自检在 tests/test_eval_cases.py 里）。
name: tests

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.12"]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: 安装依赖
        run: python -m pip install -r requirements-dev.txt
      - name: 评测数据与生成脚本一致
        run: python scripts/gen_eval_data.py --check
      - name: 前端事件类型 / 禁用键与后端一致
        run: python scripts/gen_ui_types.py --check
      - name: pytest
        run: python -m pytest -q -p no:cacheprovider --durations=10

  # 阶段 5 F0：前端 lint / 单测 / 构建（含"无内联 script"检查），再用后端托管构建产物跑 Playwright（带真实 CSP）。
  # Node 版本与 S 本机一致（24）；Playwright 浏览器只在这里装，S 本机不装。
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONUTF8: "1"
    defaults:
      run:
        working-directory: ui/web
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: ui/web/package-lock.json
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: 安装依赖
        run: |
          npm ci
          python -m pip install -r ../../requirements.txt
      - name: lint
        run: npm run lint
      - name: 单测（vitest）
        run: npm test
      - name: 构建（含 dist/index.html 无内联 script 检查）
        run: npm run build
      - name: Playwright（后端托管 dist）
        run: |
          npx playwright install --with-deps chromium
          npx playwright test
      - uses: actions/upload-artifact@v7
        with:
          name: web-dist
          path: ui/web/dist
          retention-days: 7
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-results
          path: ui/web/test-results
          retention-days: 7
