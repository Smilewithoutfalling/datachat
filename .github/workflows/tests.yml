# 阶段 3：每次推送与 PR 在 GitHub 云端跑 pytest（Linux + Windows × Python 3.11 / 3.12）。
# 公开仓库的 Actions 分钟数免费；不调用任何模型，不需要 Key（oracle 自检在 tests/test_eval_cases.py 里）。
name: tests

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.12"]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: 安装依赖
        run: python -m pip install -r requirements-dev.txt
      - name: 评测数据与生成脚本一致
        run: python scripts/gen_eval_data.py --check
      - name: pytest
        run: python -m pytest -q -p no:cacheprovider --durations=10
