# 阶段 6 D1：Tauri 壳 + NSIS 安装包，在 windows-latest 上打包并做安装冒烟（docs/roadmap/phase6-desktop.md §2 验收）。
# 沙箱是 aarch64 Linux，Windows 安装包只能在这里打；S 本机不装 Rust / Node，直接下载这里的工件试装。
name: desktop

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "desktop/**"
      - "packaging/**"
      - "app/**"
      - "ui/web/**"
      - "requirements.txt"
      - ".github/workflows/desktop.yml"

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            packaging/requirements-build.txt
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: ui/web/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri
      - name: 安装 Python 依赖
        run: python -m pip install -r requirements.txt -r packaging/requirements-build.txt
      - name: 构建前端
        working-directory: ui/web
        run: |
          npm ci
          npm run build
      - name: 打包 sidecar 并放进壳的 resources
        shell: pwsh
        run: |
          python packaging/build_sidecar.py
          Copy-Item -Recurse -Force dist/datachat-sidecar/* desktop/src-tauri/sidecar/
      - name: 打包壳（NSIS）
        working-directory: desktop
        shell: pwsh
        run: |
          $t = Get-Date
          npx --yes @tauri-apps/cli@2 build
          "build_seconds=$([int]((Get-Date) - $t).TotalSeconds)" | Tee-Object -FilePath ../desktop-report.txt
          $setup = Get-ChildItem src-tauri/target/release/bundle/nsis/*.exe | Select-Object -First 1
          "installer=$($setup.Name)" | Tee-Object -FilePath ../desktop-report.txt -Append
          "installer_mb=$([math]::Round($setup.Length / 1MB, 1))" | Tee-Object -FilePath ../desktop-report.txt -Append
      - name: 安装冒烟（静默安装 → --smoke → 强杀壳 → 静默卸载）
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $rep = "desktop-report.txt"
          $setup = (Get-ChildItem desktop/src-tauri/target/release/bundle/nsis/*.exe | Select-Object -First 1).FullName
          Start-Process $setup -ArgumentList "/S" -Wait
          $dir = Join-Path $env:LOCALAPPDATA "DataChat"
          if (-not (Test-Path $dir)) { throw "安装目录不存在：$dir" }
          $exe = Get-ChildItem $dir -Filter *.exe | Where-Object { $_.Name -notmatch "uninstall" } | Select-Object -First 1
          "installed_exe=$($exe.Name)" | Tee-Object -FilePath $rep -Append
          if (-not (Test-Path (Join-Path $dir "sidecar/datachat-sidecar.exe"))) { throw "sidecar 没装上" }

          # ① --smoke：起 sidecar → 首页 200 → POST /shutdown → 退出码 0
          $p = Start-Process $exe.FullName -ArgumentList "--smoke", "$PWD\smoke-shell.json" -Wait -PassThru
          Get-Content smoke-shell.json | Tee-Object -FilePath $rep -Append
          if ($p.ExitCode -ne 0) { throw "--smoke 失败，退出码 $($p.ExitCode)" }

          # ② 强杀壳，sidecar 必须被 Job Object 一起带走
          $hold = Start-Process $exe.FullName -ArgumentList "--smoke-hold", "$PWD\sidecar.pid" -PassThru
          for ($i = 0; $i -lt 60 -and -not (Test-Path sidecar.pid); $i++) { Start-Sleep -Milliseconds 500 }
          $sp = Get-Content sidecar.pid
          if ($sp -notmatch '^\d+$') { throw "smoke-hold 没起来：$sp" }
          if (-not (Get-Process -Id $sp -ErrorAction SilentlyContinue)) { throw "sidecar 没在运行" }
          Stop-Process -Id $hold.Id -Force
          Start-Sleep -Seconds 3
          $left = Get-Process -Id $sp -ErrorAction SilentlyContinue
          "orphan_after_kill=$([bool]$left)" | Tee-Object -FilePath $rep -Append
          if ($left) { throw "壳被强杀后 sidecar（pid $sp）还活着" }

          # ③ 静默卸载：安装目录删掉，数据目录保留（卸载页勾选框默认不勾）
          $data = Join-Path $env:LOCALAPPDATA "datachat"
          New-Item -ItemType Directory -Force $data | Out-Null
          Set-Content (Join-Path $data "keep.txt") "x"
          Start-Process (Join-Path $dir "uninstall.exe") -ArgumentList "/S" -Wait
          for ($i = 0; $i -lt 60 -and (Test-Path (Join-Path $dir $exe.Name)); $i++) { Start-Sleep -Milliseconds 500 }
          $gone = -not (Test-Path (Join-Path $dir $exe.Name))
          $kept = Test-Path (Join-Path $data "keep.txt")
          "uninstalled=$gone data_kept=$kept" | Tee-Object -FilePath $rep -Append
          if (-not $gone) { throw "卸载后程序还在" }
          if (-not $kept) { throw "卸载把数据目录删了" }
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: desktop-report
          path: |
            desktop-report.txt
            smoke-shell.json
          retention-days: 30
      - uses: actions/upload-artifact@v7
        with:
          name: datachat-setup-win64
          path: desktop/src-tauri/target/release/bundle/nsis/*.exe
          retention-days: 14
