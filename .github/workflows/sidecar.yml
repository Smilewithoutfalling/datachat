# 阶段 4 spike：在 Windows runner 上用 PyInstaller 打 sidecar（onedir），验证打包后沙箱子进程与后端都能工作（B35）。
# S 本机磁盘紧张，不在本地打包；产物作为 artifact 保留 7 天，需要时再下载试用。
name: sidecar

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "packaging/**"
      - "app/sidecar.py"
      - "app/tools/sandbox*.py"
      - "app/tools/_winjob.py"
      - "app/server/**"
      - "requirements.txt"
      - ".github/workflows/sidecar.yml"

concurrency:
  group: sidecar-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 40
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            packaging/requirements-build.txt
      - name: 安装依赖
        run: python -m pip install -r requirements.txt -r packaging/requirements-build.txt
      - name: 打包
        shell: pwsh
        run: |
          $t = Get-Date
          python packaging/build_sidecar.py
          "build_seconds=$([int]((Get-Date) - $t).TotalSeconds)" | Tee-Object -FilePath size.txt
          $files = Get-ChildItem dist/datachat-sidecar -Recurse -File
          "files=$($files.Count)" | Tee-Object -FilePath size.txt -Append
          "size_mb=$([math]::Round(($files | Measure-Object Length -Sum).Sum / 1MB, 1))" | Tee-Object -FilePath size.txt -Append
          "--- 最大的 15 个目录（MB）---" | Tee-Object -FilePath size.txt -Append
          Get-ChildItem dist/datachat-sidecar/_internal -Directory | ForEach-Object {
            [pscustomobject]@{ mb = [math]::Round((Get-ChildItem $_.FullName -Recurse -File | Measure-Object Length -Sum).Sum / 1MB, 1); name = $_.Name }
          } | Sort-Object mb -Descending | Select-Object -First 15 | Format-Table -AutoSize | Out-String | Tee-Object -FilePath size.txt -Append
      - name: 冒烟测试（自检 + 后端 + 重启）
        run: python packaging/smoke_sidecar.py dist/datachat-sidecar/datachat-sidecar.exe smoke.json
      - name: 压缩产物
        if: always()
        shell: pwsh
        run: |
          if (Test-Path dist/datachat-sidecar) {
            Compress-Archive dist/datachat-sidecar datachat-sidecar-win64.zip
            "zip_mb=$([math]::Round((Get-Item datachat-sidecar-win64.zip).Length / 1MB, 1))" | Tee-Object -FilePath size.txt -Append
          }
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: sidecar-report
          path: |
            size.txt
            smoke.json
            build/datachat-sidecar/warn-datachat-sidecar.txt
          retention-days: 30
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: datachat-sidecar-win64
          path: datachat-sidecar-win64.zip
          if-no-files-found: ignore
          retention-days: 7
